<!-- WIREFRAME_PROGRESS_START -->
<style data-generation-progress-style>
  [data-generation-progress] {
    margin: 0; padding: .85rem 1rem; border-bottom: 2px solid var(--pico-color);
    color: var(--pico-color); background: var(--pico-background-color);
  }
  [data-progress-header] { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  [data-generation-progress] h1 { margin: 0; font-size: 1rem; }
  [data-static-html-link] {
    display: inline-flex; min-height: 32px; align-items: center; margin: 0;
    padding: .25rem .65rem; font-size: .78rem; white-space: nowrap;
  }
  [data-static-html-pending] { color: var(--pico-muted-color); font-size: .78rem; }
  [data-generation-progress] ol {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
    gap: .4rem; margin: .7rem 0; padding: 0; list-style: none;
  }
  [data-generation-progress] li {
    min-height: 2.4rem; padding: .45rem .55rem; border: 1px solid var(--pico-muted-border-color);
    background: var(--pico-card-background-color); font-size: .78rem; line-height: 1.35;
  }
  [data-generation-progress] li::before { display: inline-block; width: 1.25rem; font-weight: 800; }
  [data-generation-progress] li[data-state="pending"]::before { content: "○"; }
  [data-generation-progress] li[data-state="running"] { border-width: 2px; font-weight: 800; }
  [data-generation-progress] li[data-state="running"]::before { content: "●"; }
  [data-generation-progress] li[data-state="pass"]::before { content: "✓"; }
  [data-generation-progress] li[data-state="fail"] { border-width: 3px; }
  [data-generation-progress] li[data-state="fail"]::before { content: "!"; }
  [data-generation-progress] li[data-state="not-run"] { color: var(--pico-muted-color); border-style: dashed; }
  [data-generation-progress] li[data-state="not-run"]::before { content: "−"; }
  [data-generation-progress] p { margin: .25rem 0 0; font-size: .8rem; line-height: 1.4; }
  [data-progress-timing] { font-variant-numeric: tabular-nums; }
  [data-reset-preview-state] { width: auto; min-height: 32px; margin: 0 0 0 .5rem; padding: .2rem .5rem; font-size: .75rem; }
  [data-hot-reload-status][data-state="error"],
  [data-hot-reload-status][data-state="disconnected"] { font-weight: 700; }
  @media (max-width: 480px) {
    [data-generation-progress] { padding: .7rem; }
    [data-progress-header] { align-items: flex-start; flex-direction: column; }
    [data-generation-progress] ol { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    [data-generation-progress] li { padding: .4rem; font-size: .7rem; }
  }
</style>
<section data-generation-progress data-status="{{PROGRESS_STATUS}}" data-static-html-url="{{STATIC_HTML_URL}}" data-static-html-name="{{STATIC_HTML_NAME}}">
  <header data-progress-header>
    <h1>{{PROGRESS_TITLE}}</h1>
    <small data-static-html-pending>静的HTMLは完成後に保存できます</small>
  </header>
  <ol>
{{PROGRESS_STEPS}}
  </ol>
  <p data-progress-message role="status" aria-live="polite" aria-atomic="true">現在: {{PROGRESS_MESSAGE}}</p>
  <p data-progress-timing>経過時間: <time data-progress-elapsed aria-live="off">00:00:00</time></p>
  <p>プレビュー: <span data-hot-reload-status data-state="starting" role="status" aria-live="polite" aria-atomic="true">接続を開始しています</span><button type="button" class="secondary outline" data-reset-preview-state>状態をリセット</button></p>
</section>
<script type="application/json" data-generation-progress-state>{{PROGRESS_STATE_JSON}}</script>
{{HOT_RELOAD_CLIENT}}
<!-- WIREFRAME_PROGRESS_END -->
