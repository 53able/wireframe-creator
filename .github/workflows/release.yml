name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: wireframe-creator-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate skill runtime
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py tests/*.py

  release:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare version and release notes
        id: prepare
        run: |
          python .github/scripts/prepare-release.py \
            --bump "${{ inputs.bump }}" \
            --release-notes "$RUNNER_TEMP/release-notes.md"

      - name: Validate release tooling and skill scripts
        run: |
          python .github/scripts/test_release.py
          python -m unittest discover -s tests -v
          python -m py_compile scripts/*.py .github/scripts/*.py tests/*.py
          test "$(cat VERSION)" = "${{ steps.prepare.outputs.version }}"

      - name: Build skill-only ZIP
        id: package
        run: |
          python .github/scripts/package-skill.py \
            --version "${{ steps.prepare.outputs.version }}" \
            --output-dir dist | tee "$RUNNER_TEMP/package-output.txt"
          unzip -t "dist/wireframe-creator-v${{ steps.prepare.outputs.version }}.zip"
          sha256sum "dist/wireframe-creator-v${{ steps.prepare.outputs.version }}.zip"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore: release ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"
          git push --atomic origin HEAD:main "${TAG}"

      - name: Create GitHub release with skill ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            "dist/wireframe-creator-v${VERSION}.zip" \
            --title "wireframe-creator ${TAG}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

  build-mac-app:
    if: github.ref == 'refs/heads/main'
    needs: release
    runs-on: macos-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build and package the macOS app
        run: ./scripts/package-mac-workspace.sh

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/Agent-Workspace-*.dmg --clobber
